<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d2b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flipside" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Flipside</title>
  <style>
    :root { --fs: clamp(13px, 0.95vw + 4px, 20px); --panel: #0b0e1acc; --ok: #3ddc6f; --warn: #ff6b5b; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d2b; color: #fff; font: var(--fs) system-ui, sans-serif; }
    canvas { display: block; }
    [hidden] { display: none !important; }
    .labels { position: fixed; top: 0; left: 0; pointer-events: none; }
    /* 18b: HUD panels sit above the 3D name labels (the CSS2D layer is appended after them). */
    #hud-top, #hud-board, #hud-status, #hud-center, #hud-toasts, #hud-fx, #pad-hint { z-index: 1; }
    .label { color: #fff; font-size: 0.75em; background: #0009; padding: 1px 6px; border-radius: 8px; border: 2px solid; transition: opacity 0.15s; }
    .dot { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 50%; margin-right: 0.5em; vertical-align: -0.05em; box-shadow: 0 0 0 2px #0006; }
    .ok { color: var(--ok); font-weight: 600; }
    .dim { color: #9aa0b8; }
    .warn { color: var(--warn); font-weight: 600; }
    .hearts { color: #ff4d6d; letter-spacing: 0.05em; }
    .hearts .dim { color: #ffffff30; }
    .list li.out { opacity: 0.5; }
    .muted { color: #ffb347; }
    kbd { background: #fff2; border: 1px solid #fff5; border-radius: 4px; padding: 0 0.35em; font: inherit; }

    #hud-top, #hud-board, #hud-status, #hud-center .panel { background: var(--panel); border-radius: 10px; backdrop-filter: blur(4px); }
    #hud-top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); padding: 0.4em 0.8em; font-size: 1.05em; }
    #hud-top .timer { font-variant-numeric: tabular-nums; font-size: 1.5em; font-weight: 700; }
    #hud-top .timer.warn { color: var(--warn); }
    #hud-board { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); padding: 0.4em 0.8em; min-width: 12em; }
    #hud-fx { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    #hud-fx .pill { position: relative; display: grid; place-items: center; width: 2.6em; height: 2.6em; border-radius: 50%;
      background: conic-gradient(var(--ring, #fff) calc(var(--p) * 1turn), #fff3 0); }
    #hud-fx .pill i { display: grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; background: var(--panel); font-style: normal; }
    #hud-fx .pill b { position: absolute; bottom: -1.3em; font-size: 0.75em; font-weight: normal; }
    #hud-fx .bouncy { --ring: #ff6fb5; } #hud-fx .lethargy { --ring: #e63946; } #hud-fx .heavy { --ring: #9aa3ad; } #hud-fx .sunglasses { --ring: #ffd166; }
    #hud-status { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 0.5em 1.1em; font-size: 1.1em; white-space: nowrap; }
    #hud-center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
    #hud-center .panel { padding: 1em 1.6em; min-width: 18em; max-width: 90vw; text-align: center; }
    #hud-center h1 { margin: 0 0 0.2em; font-size: 2em; }
    #hud-center .sub { color: #c8cce0; margin-bottom: 0.6em; }
    #hud-center .hint { margin-top: 0.7em; font-size: 1.1em; }
    #hud-center .big { font-size: clamp(90px, 18vh, 220px); font-weight: 800; text-shadow: 0 4px 24px #000a; }
    #hud-center .big.move { font-size: clamp(48px, 9vh, 110px); color: #ff6a1e; animation: pulse 0.35s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
    .cards { display: flex; gap: 0.6em; justify-content: center; flex-wrap: wrap; margin: 0.4em 0 0.8em; }
    .card { pointer-events: auto; cursor: pointer; position: relative; width: 11em; padding: 0.4em; background: #ffffff12; border: 2px solid #ffffff30; border-radius: 10px; color: inherit; font: inherit; }
    .card:hover { border-color: #fffa; }
    .card.mine { border-color: var(--ok); background: #3ddc6f22; }
    .card img, .card .random { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 6px; }
    .card .random { display: grid; place-items: center; font-size: 3em; font-weight: 800; background: #ffffff10; }
    .card kbd { position: absolute; top: 0.6em; left: 0.6em; background: #000a; }
    .card .cname { font-weight: 700; margin-top: 0.3em; }
    .card .cmode { font-size: 0.85em; color: #c8cce0; }
    .card .trap { margin-left: 0.25em; }
    .card .votes { margin-top: 0.2em; color: #ffd166; font-size: 0.9em; }
    .list { list-style: none; margin: 0; padding: 0; text-align: left; }
    .list li { display: flex; align-items: center; gap: 0.2em; padding: 0.15em 0; }
    .list li.me .name { font-weight: 700; }
    .list .name { flex: 1; }
    .list .val { margin-left: 1.2em; font-variant-numeric: tabular-nums; }
    #hud-toasts { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    .toast { background: var(--panel); padding: 0.35em 0.9em; border-radius: 8px; transition: opacity 0.4s; }
    .toast.out { opacity: 0; }
    #tuning { position: fixed; top: 12px; left: 12px; bottom: 12px; overflow-y: auto; width: 21em; font: 12px system-ui, sans-serif; background: #000d; padding: 8px 10px; border-radius: 8px; z-index: 10; }
    #tuning h3 { margin: 6px 0; font-size: 13px; }
    #tuning label { display: grid; grid-template-columns: 7em 1fr 3em 2em; align-items: center; gap: 4px; }
    #tuning output { font-variant-numeric: tabular-nums; text-align: right; }
    #tuning button { font: inherit; cursor: pointer; }
    #tuning > div { margin-top: 8px; display: flex; gap: 6px; }
    /* Single player (phase 15b): HUD extras, and the ceramic/lavender menu over the orbiting level. */
    #hud-top .timer.flash { animation: flash 0.5s steps(2) infinite; }
    #hud-top .timer.frozen { color: #8fd3ff; }
    @keyframes flash { 50% { opacity: 0.25; } }
    #hud-board .score { font-size: 1.8em; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
    #hud-board .fruits { display: flex; gap: 0.25em; justify-content: flex-end; font-size: 1.3em; }
    .fruit.empty { filter: grayscale(1); opacity: 0.25; }
    #hud-center .big.ready { font-size: clamp(48px, 9vh, 110px); color: #e9e2ff; }
    #menu .version { position: fixed; right: 12px; bottom: 10px; color: #e9e2ffaa; font-size: 0.8em; }
    #menu { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(#2a1f4a33, #120d2488); z-index: 5; }
    .mpanel { min-width: 20em; max-width: min(40em, 92vw); padding: 1.4em 1.8em 1.6em; text-align: center; color: #3b2d63;
      background: linear-gradient(160deg, #f6f2ff, #dcd2f5); border-radius: 22px; border: 1px solid #fff;
      box-shadow: 0 2px 0 #fff inset, 0 -3px 0 #b7a8e0 inset, 0 18px 50px #1a103a88; }
    .mpanel h1, .mpanel h2 { margin: 0.1em 0 0.6em; }
    .mpanel .logo { font-size: 2.6em; letter-spacing: 0.12em; color: #6b4fc8; text-shadow: 0 2px 0 #fff, 0 4px 0 #b7a8e0; }
    .mpanel .over { font-size: 2.6em; color: #d7263d; }
    .mpanel .sub { color: #6c5f93; margin-bottom: 0.4em; }
    .mpanel .col { display: flex; flex-direction: column; gap: 0.55em; margin-top: 0.8em; }
    .mpanel .row { display: flex; gap: 0.6em; justify-content: center; margin-top: 0.8em; }
    .mpanel .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5em; }
    .mbtn { font: inherit; font-size: 1.05em; padding: 0.6em 1.2em; border-radius: 14px; cursor: pointer; color: #3b2d63; text-align: left;
      background: linear-gradient(#ffffff, #ebe5fb); border: 1px solid #cbbff0; box-shadow: 0 3px 0 #b7a8e0, 0 6px 14px #6b4fc822; }
    .mpanel .col .mbtn, .mpanel .row .mbtn { text-align: center; }
    .mbtn:hover:not([disabled]) { background: linear-gradient(#fff, #f3efff); border-color: #8f78e0; }
    .mbtn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 #b7a8e0; }
    .mbtn.primary { background: linear-gradient(#8f78e0, #6b4fc8); color: #fff; border-color: #5a3fb5; box-shadow: 0 3px 0 #4a3296, 0 6px 16px #6b4fc855; }
    .mbtn[disabled] { opacity: 0.4; cursor: default; }
    .mbtn:focus-visible, .mbtn:focus { outline: 3px solid #ffd166; outline-offset: 2px; }
    .mpanel table.binds td .mbtn { padding: 0.25em 0.8em; min-width: 6em; text-align: center; }
    .mpanel table.binds th { font-size: 0.85em; color: #6c5f93; text-align: center; }
    #pad-hint { position: fixed; left: 12px; bottom: 16px; padding: 0.35em 0.8em; border-radius: 10px; background: var(--panel); font-size: 0.9em; }
    .mbtn small { display: block; font-size: 0.75em; opacity: 0.75; }
    .mpanel .field { display: flex; gap: 0.6em; align-items: center; justify-content: center; margin: 0.4em 0; }
    .mpanel input:not([type]) { font: inherit; padding: 0.35em 0.6em; border-radius: 10px; border: 1px solid #b7a8e0; }
    .mpanel .err { color: #d7263d; margin-top: 0.4em; }
    .mpanel table { margin: 0.6em auto 0; border-collapse: collapse; min-width: 16em; font-variant-numeric: tabular-nums; }
    .mpanel td { padding: 0.2em 0.6em; text-align: left; } .mpanel td + td { text-align: right; }
    .mpanel tr.total td { border-top: 2px solid #b7a8e0; font-weight: 800; }
    .mpanel td small { opacity: 0.7; }
    /* Phase 17: off-screen enemy arrows (multiplayer). */
    #offscreen { position: fixed; inset: 0; pointer-events: none; }
    .offscreen-arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; margin: -10px 0 0 -10px;
      border-left: 20px solid currentColor; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
      filter: drop-shadow(0 0 3px #000a); transform-origin: 0 10px; }
    /* Phase 18: matches. */
    #hud-board .round { font-weight: 700; margin-bottom: 0.2em; color: #ffd166; }
    .list.board li.out { opacity: 0.45; }
    .pop { display: inline-block; color: #6ff0c0; font-weight: 800; animation: pop 0.6s cubic-bezier(.2,1.6,.4,1) both; animation-delay: 0.4s; }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .card.len { width: 7em; }
    #hud-center h2 { margin: 0.2em 0 0.3em; font-size: 1.2em; }
    .podium-title { position: fixed; top: 8vh; left: 50%; transform: translateX(-50%); max-width: 92vw; text-align: center; font-size: clamp(28px, 5vh, 56px); font-weight: 800;
      padding: 0.1em 0.6em; border-radius: 14px; background: var(--panel); -webkit-text-stroke: 1.5px #0b0e1a; paint-order: stroke fill; text-shadow: 0 3px 16px #000a; }
    .podium-label { color: #3b2d63; background: #f6f2ffee; border: 2px solid; border-radius: 10px; padding: 2px 10px; text-align: center; font-size: 0.95em; }
    .statcard { border-collapse: collapse; margin: 0.4em auto; font-variant-numeric: tabular-nums; }
    .statcard th { font-size: 0.8em; color: #c8cce0; font-weight: 600; padding: 0 0.5em; }
    .statcard td { padding: 0.2em 0.5em; text-align: center; } .statcard td:nth-child(2) { text-align: left; }
    .statcard tr.me td { font-weight: 700; } .statcard tr.out td { opacity: 0.45; }
    .badge { display: inline-block; margin: 0 0.2em; padding: 0 0.5em; border-radius: 8px; background: #ffd16633; color: #ffd166; font-size: 0.8em; white-space: nowrap; }
    .rematch { display: flex; gap: 0.6em; justify-content: center; align-items: center; margin-top: 0.6em; }
    .rematch .card { width: auto; padding: 0.5em 1.2em; font-weight: 700; }
    .offscreen-arrow.crowned::after { content: '👑'; position: absolute; left: -34px; top: -12px; font-size: 16px; }
    /* Phase 19: online rooms. */
    .roombar { display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center; justify-content: center; margin-bottom: 0.6em; }
    .roombar .code { font-size: 2em; letter-spacing: 0.15em; color: #ffd166; font-variant-numeric: tabular-nums; }
    .roombar .bots { display: inline-flex; gap: 0.3em; align-items: center; }
    .mini { pointer-events: auto; cursor: pointer; font: inherit; font-size: 0.9em; color: inherit; background: #ffffff18; border: 1px solid #ffffff40; border-radius: 8px; padding: 0.2em 0.7em; }
    .mini:hover:not([disabled]) { border-color: #fffa; } .mini.on { border-color: var(--ok); background: #3ddc6f33; } .mini[disabled] { opacity: 0.4; cursor: default; }
    .fill { margin-bottom: 0.6em; color: #ffd166; }
    .host { color: #ffd166; font-size: 0.85em; }
    #reconnecting { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e1acc; font-size: 2em; font-weight: 700; z-index: 20; }
    #debug { position: fixed; bottom: 12px; right: 12px; margin: 0; color: #cfe; font: 12px ui-monospace, monospace; background: #000b; padding: 8px; border-radius: 6px; }
    /* Phase 19b: phones and tablets. No zoom, selection, long-press menu or overscroll; safe areas; the touch layer. */
    html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    input { -webkit-user-select: text; user-select: text; }
    canvas { touch-action: none; }
    #menu-code { text-transform: uppercase; }
    .mpanel.touch .grid .mbtn { text-align: center; }
    .mpanel { max-height: calc(100dvh - 24px); overflow-y: auto; box-sizing: border-box; }
    @media (pointer: coarse) {
      .mbtn, .mini, .card { min-height: 44px; }
      .mini { min-width: 44px; padding: 0.3em 0.9em; }
      .mpanel input:not([type]) { font-size: 16px; } /* iOS zooms into smaller inputs */
      .mpanel input[type=range] { height: 44px; }
    }
    #touch { position: fixed; inset: 0; z-index: 2; pointer-events: none; touch-action: none; --k: 1; --touch-opacity: 0.6;
      --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
      --jump: calc(clamp(72px, 24vmin, 150px) * var(--k)); --ring: calc(clamp(110px, 34vmin, 220px) * var(--k)); }
    #touch > * { pointer-events: auto; touch-action: none; }
    #touch .t-zone, #touch .t-pad, #touch .t-jump { display: none; }
    #touch.play .t-zone, #touch.play .t-pad, #touch.play .t-jump { display: block; }
    #touch .t-zone { position: absolute; top: 0; bottom: 0; width: 50%; }
    #touch .t-zone[data-zone=dpad], #touch.lefty .t-zone[data-zone=look] { left: 0; }
    #touch .t-zone[data-zone=look], #touch.lefty .t-zone[data-zone=dpad] { left: 50%; }
    #touch .t-pad { position: absolute; width: 0; height: 0; pointer-events: none; opacity: var(--touch-opacity);
      left: calc(var(--sl) + 5vmin + var(--ring) / 2); top: calc(100% - var(--sb) - 5vmin - var(--ring) / 2); }
    #touch.lefty .t-pad { left: calc(100% - var(--sr) - 5vmin - var(--ring) / 2); }
    #touch .t-pad.live { opacity: min(1, calc(var(--touch-opacity) + 0.3)); }
    .t-ring { position: absolute; width: var(--ring); height: var(--ring); left: calc(var(--ring) / -2); top: calc(var(--ring) / -2); box-sizing: border-box;
      border-radius: 50%; border: 3px solid #fffc; background: radial-gradient(#0b0e1a33, #0b0e1a88); }
    .t-ring b { position: absolute; color: #fffb; font-size: calc(var(--ring) * 0.15); line-height: 1; transform: translate(-50%, -50%); }
    .t-ring .t-n { left: 50%; top: 17%; } .t-ring .t-w { left: 17%; top: 50%; } .t-ring .t-e { left: 83%; top: 50%; }
    .t-ring b.on { color: #ffd166; text-shadow: 0 0 12px #ffd166; }
    .t-thumb { position: absolute; width: calc(var(--ring) * 0.36); height: calc(var(--ring) * 0.36); left: calc(var(--ring) * -0.18); top: calc(var(--ring) * -0.18);
      border-radius: 50%; background: #fffd; box-shadow: 0 2px 8px #0008; }
    #touch .t-jump { position: absolute; right: calc(var(--sr) + 5vmin); bottom: calc(var(--sb) + 5vmin); width: var(--jump); height: var(--jump); border-radius: 50%;
      border: 3px solid #fffc; background: #ff6a1e99; color: #fff; font: 800 calc(var(--jump) * 0.2) system-ui, sans-serif; opacity: var(--touch-opacity); }
    #touch.lefty .t-jump { right: auto; left: calc(var(--sl) + 5vmin); }
    #touch .t-jump.on { background: #ff6a1e; transform: scale(0.94); }
    #touch .t-pause { position: absolute; top: calc(var(--st) + 10px); left: calc(var(--sl) + 10px); width: 44px; height: 44px; border-radius: 12px;
      border: 2px solid #fff8; background: var(--panel); color: #fff; font: 700 15px system-ui, sans-serif; opacity: max(0.75, var(--touch-opacity)); }
    #touch .t-ready { position: absolute; left: 50%; bottom: calc(var(--sb) + 12px); transform: translateX(-50%); min-height: 56px; padding: 0 2.4em; border-radius: 28px;
      border: 2px solid #fff8; background: linear-gradient(#8f78e0, #6b4fc8); color: #fff; font: 800 1.3em system-ui, sans-serif; box-shadow: 0 4px 16px #0008; }
    #touch .t-ready.on { background: linear-gradient(#5be38a, #2fbf62); }
    #touch .t-stats { position: absolute; top: calc(var(--st) + 2px); left: 50%; transform: translateX(-50%); pointer-events: none;
      font: 11px ui-monospace, monospace; background: #0009; padding: 1px 6px; border-radius: 6px; }
    body.show-stats #hud-toasts { top: calc(30px + env(safe-area-inset-top, 0px)); }
    body.touch-ui #hud-top { left: calc(64px + env(safe-area-inset-left, 0px)); }
    body.touch-ui #hud-center { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    body.touch-ui #pad-hint { display: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 30; place-items: center; background: #120d24f2; color: #fff; font-size: 1.4em; text-align: center; }
    #rotate b { display: block; font-size: 3em; margin-bottom: 0.2em; }
    @media (orientation: portrait) { body.touch-ui #rotate { display: grid; } }
    /* Small screens: a compact scoreboard, smaller lobby cards, and panels that scroll instead of spilling. */
    @media (max-height: 520px), (max-width: 720px) {
      #hud-board { min-width: 0; padding: 0.25em 0.6em; font-size: 0.85em; }
      #hud-board .list li { padding: 0; }
      #hud-board .round { margin-bottom: 0; }
      #hud-center .panel { padding: 0.6em 1em; max-height: calc(100% - 16px); overflow-y: auto; box-sizing: border-box; pointer-events: auto; }
      #hud-center h1 { font-size: 1.5em; }
      .cards { margin: 0.2em 0 0.4em; }
      .card { width: 8.5em; } .card.len { width: 6em; }
      #hud-fx { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
</head>
<body>
  <div id="rotate"><div><b>⟳</b>Rotate your device</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
